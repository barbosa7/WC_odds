syntax = "proto3";

package tyche.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

message Decimal {
  string value = 1;
}

enum ContractStatus {
  CONTRACT_STATUS_UNSPECIFIED = 0;
  CONTRACT_STATUS_OPEN = 1;
  CONTRACT_STATUS_CLOSED = 2;
}

enum EventStatus {
  EVENT_STATUS_UNSPECIFIED = 0;
  EVENT_STATUS_OPEN = 1;
  EVENT_STATUS_SETTLEMENT_OPEN = 2;
  EVENT_STATUS_SETTLED = 3;
}

enum OrderSide {
  ORDER_SIDE_UNSPECIFIED = 0;
  ORDER_SIDE_BUY = 1;
  ORDER_SIDE_SELL = 2;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_OPEN = 1;
  ORDER_STATUS_PARTIALLY_FILLED = 2;
  ORDER_STATUS_FILLED = 3;
  ORDER_STATUS_CANCELLED = 4;
  ORDER_STATUS_CANCELLED_CONTRACT_CLOSED = 5;
}

enum TradeSource {
  TRADE_SOURCE_UNSPECIFIED = 0;
  TRADE_SOURCE_ORDERBOOK = 1;
  TRADE_SOURCE_MANUAL = 2;
  TRADE_SOURCE_CORRECTION = 3;
}

message UserProfile {
  string id = 1;
  string name = 2;
}

message User {
  string id = 1;
  string email = 2;
  string name = 3;
  bool is_admin = 4;
  google.protobuf.Timestamp deleted_at = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message Event {
  string id = 1;
  string slug = 2;
  string title = 3;
  string description = 4;
  google.protobuf.Struct metadata = 5;
  EventStatus status = 6;
  google.protobuf.Timestamp settlement_started_at = 7;
  optional string settlement_started_by = 8;
  google.protobuf.Timestamp settled_at = 9;
  optional string settled_by = 10;
  string created_by = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

message Contract {
  string id = 1;
  string event_id = 2;
  string title = 3;
  string description = 4;
  google.protobuf.Struct metadata = 5;
  ContractStatus status = 6;
  Decimal final_value = 7;
  google.protobuf.Timestamp closed_at = 8;
  optional string closed_by = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message Order {
  string id = 1;
  string contract_id = 2;
  string user_id = 3;
  OrderSide side = 4;
  Decimal limit_price = 5;
  Decimal original_quantity = 6;
  Decimal remaining_quantity = 7;
  OrderStatus status = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp cancelled_at = 10;
}

message Trade {
  string id = 1;
  string contract_id = 2;
  string buyer_user_id = 3;
  string seller_user_id = 4;
  Decimal price = 5;
  Decimal quantity = 6;
  TradeSource source = 7;
  optional string buy_order_id = 8;
  optional string sell_order_id = 9;
  optional string reason = 10;
  string created_by = 11;
  google.protobuf.Timestamp traded_at = 12;
  google.protobuf.Timestamp created_at = 13;
}

message Position {
  string contract_id = 1;
  string user_id = 2;
  Decimal net_quantity = 3;
  Decimal cash = 4;
  Decimal settled_value = 5;
  int64 trade_count = 6;
}

message SettlementTransfer {
  string id = 1;
  string event_id = 2;
  string payer_user_id = 3;
  string payee_user_id = 4;
  Decimal amount = 5;
  string reason = 6;
  string recorded_by = 7;
  google.protobuf.Timestamp paid_at = 8;
  google.protobuf.Timestamp created_at = 9;
}

message EventSettlementBalance {
  string event_id = 1;
  string user_id = 2;
  EventStatus event_status = 3;
  int64 contract_count = 4;
  int64 open_contract_count = 5;
  int64 closed_contract_count = 6;
  bool is_ready = 7;
  Decimal gross_settlement_value = 8;
  Decimal total_paid = 9;
  Decimal total_received = 10;
  Decimal remaining_settlement_value = 11;
}

message EventSettlement {
  Event event = 1;
  EventStatus event_status = 2;
  bool is_ready = 3;
  int64 contract_count = 4;
  int64 open_contract_count = 5;
  int64 closed_contract_count = 6;
  repeated EventSettlementBalance balances = 7;
  repeated SettlementTransfer transfers = 8;
}

message OrderBookLevel {
  Decimal price = 1;
  Decimal quantity = 2;
  int64 order_count = 3;
}

message OrderBook {
  string contract_id = 1;
  repeated OrderBookLevel bids = 2;
  repeated OrderBookLevel asks = 3;
}

message PageRequest {
  int32 page_size = 1;
  string page_token = 2;
  int32 offset = 3;
}

message ListEventsRequest {
  PageRequest page = 1;
}

message ListEventsResponse {
  repeated Event events = 1;
  string next_page_token = 2;
}

message GetEventRequest {
  string event_id = 1;
}

message GetEventResponse {
  Event event = 1;
}

message ListContractsRequest {
  string event_id = 1;
  ContractStatus status = 2;
  PageRequest page = 3;
}

message ListContractsResponse {
  repeated Contract contracts = 1;
  string next_page_token = 2;
}

message GetContractRequest {
  string contract_id = 1;
}

message GetContractResponse {
  Contract contract = 1;
}

message ListUsersRequest {
  PageRequest page = 1;
}

message ListUsersResponse {
  repeated UserProfile users = 1;
  string next_page_token = 2;
}

message ListOrdersRequest {
  string event_id = 1;
  string contract_id = 2;
  string user_id = 3;
  OrderSide side = 4;
  OrderStatus status = 5;
  PageRequest page = 6;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  string next_page_token = 2;
}

message GetOrderBookRequest {
  string contract_id = 1;
}

message GetOrderBookResponse {
  OrderBook order_book = 1;
}

message ListTradesRequest {
  string event_id = 1;
  string contract_id = 2;
  string user_id = 3;
  TradeSource source = 4;
  PageRequest page = 5;
}

message ListTradesResponse {
  repeated Trade trades = 1;
  string next_page_token = 2;
  int64 total_count = 3;
}

message ListPositionsRequest {
  string event_id = 1;
  string contract_id = 2;
  string user_id = 3;
  PageRequest page = 4;
}

message ListPositionsResponse {
  repeated Position positions = 1;
  string next_page_token = 2;
}

message GetEventSettlementRequest {
  string event_id = 1;
  bool include_transfers = 2;
}

message GetEventSettlementResponse {
  EventSettlement settlement = 1;
}

message ListSettlementTransfersRequest {
  string event_id = 1;
  string user_id = 2;
  PageRequest page = 3;
}

message ListSettlementTransfersResponse {
  repeated SettlementTransfer transfers = 1;
  string next_page_token = 2;
}

message GetLeaderboardRequest {
  string event_id = 1;
}

message LeaderboardEntry {
  string user_id = 1;
  string name = 2;
  Decimal total_pnl = 3;
  bool has_unpriced = 4;
  int32 position_count = 5;
}

message GetLeaderboardResponse {
  repeated LeaderboardEntry entries = 1;
  Decimal expected_charity_pnl = 2;
  int32 winner_count = 3;
  int32 loser_count = 4;
}

message ContractMark {
  string contract_id = 1;
  Decimal price = 2;
}

message ListContractMarksRequest {
  string event_id = 1;
}

message ListContractMarksResponse {
  repeated ContractMark marks = 1;
}

service QueryService {
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  rpc GetEvent(GetEventRequest) returns (GetEventResponse);
  rpc ListContracts(ListContractsRequest) returns (ListContractsResponse);
  rpc GetContract(GetContractRequest) returns (GetContractResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc GetOrderBook(GetOrderBookRequest) returns (GetOrderBookResponse);
  rpc ListTrades(ListTradesRequest) returns (ListTradesResponse);
  rpc ListPositions(ListPositionsRequest) returns (ListPositionsResponse);
  rpc GetLeaderboard(GetLeaderboardRequest) returns (GetLeaderboardResponse);
  rpc ListContractMarks(ListContractMarksRequest) returns (ListContractMarksResponse);
  rpc GetEventSettlement(GetEventSettlementRequest) returns (GetEventSettlementResponse);
  rpc ListSettlementTransfers(ListSettlementTransfersRequest) returns (ListSettlementTransfersResponse);
}

message ChatMessage {
  string id = 1;
  string user_id = 2;
  string name = 3;
  string body = 4;
  bool is_admin = 5;
  google.protobuf.Timestamp created_at = 6;
}

message SendMessageRequest {
  string body = 1;
}

message SendMessageResponse {
  ChatMessage message = 1;
}

message ListMessagesRequest {
  PageRequest page = 1;
}

message ListMessagesResponse {
  repeated ChatMessage messages = 1;
  string next_page_token = 2;
}

message DeleteMessageRequest {
  string id = 1;
}

message DeleteMessageResponse {}

service ChatService {
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse);
}

message SignUpRequest {
  string signup_token = 1;
  string email = 2;
  string password = 3;
  string name = 4;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message AuthResponse {
  User user = 1;
}

message LogoutRequest {}

message LogoutResponse {}

message GetMeRequest {}

message GetMeResponse {
  User user = 1;
}

message UpdatePasswordRequest {
  string current_password = 1;
  string new_password = 2;
}

message UpdatePasswordResponse {
  User user = 1;
}

message UpdateEmailRequest {
  string new_email = 1;
  string current_password = 2;
}

message UpdateEmailResponse {
  User user = 1;
}

service AuthService {
  rpc SignUp(SignUpRequest) returns (AuthResponse);
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
  rpc UpdatePassword(UpdatePasswordRequest) returns (UpdatePasswordResponse);
  rpc UpdateEmail(UpdateEmailRequest) returns (UpdateEmailResponse);
}

message PlaceOrderRequest {
  string contract_id = 1;
  OrderSide side = 2;
  Decimal limit_price = 3;
  Decimal quantity = 4;
}

message PlaceOrderResponse {
  Order order = 1;
  repeated Trade trades_created = 2;
}

message CancelOrderRequest {
  string order_id = 1;
}

message CancelOrderResponse {
  Order order = 1;
}

service TradingService {
  rpc PlaceOrder(PlaceOrderRequest) returns (PlaceOrderResponse);
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
}

message AdminCreateUserRequest {
  string email = 1;
  string password = 2;
  string name = 3;
  bool is_admin = 4;
}

message AdminCreateUserResponse {
  User user = 1;
}

message DeleteUserRequest {
  string user_id = 1;
}

message DeleteUserResponse {
  User user = 1;
}

message ListAdminUsersRequest {
  PageRequest page = 1;
  bool include_deleted = 2;
}

message ListAdminUsersResponse {
  repeated User users = 1;
  string next_page_token = 2;
}

message CreateEventRequest {
  string slug = 1;
  string title = 2;
  string description = 3;
  google.protobuf.Struct metadata = 4;
}

message CreateEventResponse {
  Event event = 1;
}

message UpdateEventRequest {
  string event_id = 1;
  string title = 2;
  string description = 3;
  google.protobuf.Struct metadata = 4;
}

message UpdateEventResponse {
  Event event = 1;
}

message StartEventSettlementRequest {
  string event_id = 1;
}

message StartEventSettlementResponse {
  EventSettlement settlement = 1;
}

message MarkEventSettledRequest {
  string event_id = 1;
}

message MarkEventSettledResponse {
  EventSettlement settlement = 1;
}

message CreateContractRequest {
  string event_id = 1;
  string title = 2;
  string description = 3;
  google.protobuf.Struct metadata = 4;
}

message CreateContractResponse {
  Contract contract = 1;
}

message UpdateContractRequest {
  string contract_id = 1;
  string title = 2;
  string description = 3;
  google.protobuf.Struct metadata = 4;
}

message UpdateContractResponse {
  Contract contract = 1;
}

message CloseContractRequest {
  string contract_id = 1;
  Decimal final_value = 2;
}

message CloseContractResponse {
  Contract contract = 1;
  int64 orders_cancelled = 2;
}

message InsertOffbookTradeRequest {
  string contract_id = 1;
  string buyer_user_id = 2;
  string seller_user_id = 3;
  Decimal price = 4;
  Decimal quantity = 5;
  google.protobuf.Timestamp traded_at = 6;
  TradeSource source = 7;
  optional string reason = 8;
}

message InsertOffbookTradeResponse {
  Trade trade = 1;
}

message RecordSettlementTransferRequest {
  string event_id = 1;
  string payer_user_id = 2;
  string payee_user_id = 3;
  Decimal amount = 4;
  google.protobuf.Timestamp paid_at = 5;
  string reason = 6;
}

message RecordSettlementTransferResponse {
  SettlementTransfer transfer = 1;
  EventSettlement settlement = 2;
}

service AdminService {
  rpc CreateUser(AdminCreateUserRequest) returns (AdminCreateUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  rpc ListUsers(ListAdminUsersRequest) returns (ListAdminUsersResponse);
  rpc CreateEvent(CreateEventRequest) returns (CreateEventResponse);
  rpc UpdateEvent(UpdateEventRequest) returns (UpdateEventResponse);
  rpc StartEventSettlement(StartEventSettlementRequest) returns (StartEventSettlementResponse);
  rpc MarkEventSettled(MarkEventSettledRequest) returns (MarkEventSettledResponse);
  rpc CreateContract(CreateContractRequest) returns (CreateContractResponse);
  rpc UpdateContract(UpdateContractRequest) returns (UpdateContractResponse);
  rpc CloseContract(CloseContractRequest) returns (CloseContractResponse);
  rpc InsertOffbookTrade(InsertOffbookTradeRequest) returns (InsertOffbookTradeResponse);
  rpc RecordSettlementTransfer(RecordSettlementTransferRequest) returns (RecordSettlementTransferResponse);
}

[build]
  command = "pip install -r requirements.txt && python build_site.py"
  publish = "dist"
  functions = "netlify/functions"

[[edge_functions]]
  function = "protect"
  path = "/*"

[build.environment]
  PYTHON_VERSION = "3.11"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "private, no-store"

[build]
  command = "pip install -r requirements.txt && python build_site.py"
  publish = "dist"
  functions = "netlify/functions"

[functions.tyche_opportunities]
  timeout = 26
  included_files = ["netlify/functions/data/**"]

[[edge_functions]]
  function = "protect"
  path = "/*"

[build.environment]
  PYTHON_VERSION = "3.11"
  # Auth vars are runtime-only (Netlify UI). Omit from scan — "opti"/"brazil" appear in
  # project name and Oddschecker HTML as false positives.
  SECRETS_SCAN_OMIT_KEYS = "SITE_USER,SITE_PASSWORD,AUTH_SECRET,TYCHE_EMAIL,TYCHE_PASSWORD"
  SECRETS_SCAN_OMIT_PATHS = "World Cup Winner Betting Odds _ Football _ Oddschecker.htm,World Cup Betting Odds 2026 _ Oddschecker.htm,.env.example"

[[redirects]]
  from = "/api/tyche-opportunities"
  to = "/.netlify/functions/tyche_opportunities"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "private, no-store"
